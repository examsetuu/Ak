      #et-splash,
      #et-splash *,
      #et-splash *::before,
      #et-splash *::after {
        box-sizing: border-box;
      }

      #et-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        max-width: 100%;
        height: 100vh;
        height: 100dvh;
        z-index: 9999;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 42%, rgba(245, 158, 11, 0.16) 0%, rgba(136, 19, 55, 0.24) 34%, rgba(11, 15, 25, 0) 68%),
          linear-gradient(145deg, #0b0f19 0%, #3b0719 52%, #130712 100%);
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0.45s ease;
      }

      #et-splash.et-splash--hide {
        opacity: 0;
        transform: scale(1.02);
        visibility: hidden;
        pointer-events: none;
      }

      .et-splash-glow {
        position: absolute;
        width: min(380px, 82vw);
        height: min(380px, 82vw);
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.22) 0%, rgba(245, 158, 11, 0.05) 48%, transparent 72%);
        filter: blur(22px);
        pointer-events: none;
        animation: etGlowPulse 2.4s ease-in-out infinite alternate;
      }

      .et-splash-skip {
        position: absolute;
        top: max(16px, env(safe-area-inset-top));
        right: max(16px, env(safe-area-inset-right));
        z-index: 2;
        padding: 6px 14px;
        border-radius: 9999px;
        border: 1px solid rgba(251, 191, 36, 0.32);
        background: rgba(11, 15, 25, 0.55);
        backdrop-filter: blur(8px);
        color: #fde68a;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
      }

      .et-splash-skip:hover,
      .et-splash-skip:focus-visible {
        background: rgba(245, 158, 11, 0.18);
        border-color: rgba(251, 191, 36, 0.72);
        color: #ffffff;
        outline: none;
      }

      .et-splash-skip:active {
        transform: scale(0.96);
      }

      .et-splash-card {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        animation: etEntrance 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .et-splash-emblem-wrap {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 18px 10px 10px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(245, 158, 11, 0.28);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.42), 0 0 28px rgba(245, 158, 11, 0.16);
      }

      .et-splash-monogram {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 55%, #d97706 100%);
        color: #4c0519;
        font-weight: 900;
        font-size: 19px;
        letter-spacing: -0.03em;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        flex-shrink: 0;
      }

      .et-splash-brand {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: -0.025em;
        color: #ffffff;
        line-height: 1.1;
      }

      .et-splash-brand span {
        color: #fbbf24;
      }

      .et-splash-title {
        margin: 6px 0 0;
        font-size: clamp(22px, 5.4vw, 32px);
        font-weight: 900;
        letter-spacing: -0.025em;
        line-height: 1.2;
        background: linear-gradient(90deg, #fde68a 0%, #fbbf24 45%, #f59e0b 75%, #fef3c7 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        opacity: 0;
        animation: etTextRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.18s forwards;
      }

      .et-splash-subtitle {
        margin: 0;
        font-size: clamp(13px, 3.4vw, 15px);
        font-weight: 500;
        color: rgba(254, 205, 211, 0.88);
        letter-spacing: 0.01em;
        opacity: 0;
        animation: etTextRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.32s forwards;
      }

      .et-splash-loader {
        position: absolute;
        bottom: max(28px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        width: min(220px, 68vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 1;
        opacity: 0;
        animation: etFadeOnly 0.45s ease 0.25s forwards;
      }

      .et-splash-bar-track {
        width: 100%;
        height: 3px;
        border-radius: 9999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }

      .et-splash-bar-fill {
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: linear-gradient(90deg, #d97706 0%, #fbbf24 60%, #fef08a 100%);
        box-shadow: 0 0 10px rgba(251, 191, 36, 0.65);
        transform-origin: left center;
        transform: scaleX(0);
        animation: etProgressFill 1.75s cubic-bezier(0.35, 0.05, 0.25, 1) forwards;
      }

      .et-splash-dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .et-splash-dots span {
        width: 6px;
        height: 6px;
        border-radius: 9999px;
        background: #fbbf24;
        opacity: 0.35;
        animation: etDotPulse 1.1s ease-in-out infinite;

    <script>
      (function () {
        var splash = document.getElementById('et-splash');
        var skipBtn = document.getElementById('et-splash-skip');
        if (!splash) return;

        var dismissed = false;
        var autoTimer = null;

        function dismissSplash() {
          if (dismissed) return;
          dismissed = true;
          if (autoTimer) clearTimeout(autoTimer);
          splash.classList.add('et-splash--hide');
          setTimeout(function () {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 480);
        }

        if (skipBtn) {
          skipBtn.addEventListener('click', dismissSplash);
        }

        document.addEventListener('keydown', function onSplashKey(e) {
          if (e.key === 'Escape') {
            dismissSplash();
            document.removeEventListener('keydown', onSplashKey);
          }
        });

        autoTimer = setTimeout(dismissSplash, 1800);
      })();

  function esc(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function safeHref(rawUrl) {
    const trimmed = String(rawUrl || '').trim();
    if (!trimmed) return '#';
    try {
      const p = new URL(trimmed);
      if (p.protocol === 'https:' || p.protocol === 'http:') return p.href;
    } catch {}
    return '#';
  }

  const OFFICIAL_GOV_SUFFIXES = ['.gov.in', '.nic.in', '.ac.in', '.bank.in', '.org.in', '.res.in'];

  function validateExamUrlSecurity(rawUrl) {
    const trimmed = String(rawUrl || '').trim();
    if (!trimmed) {
      return {
        url: '',
        isSecure: false,
        status: 'invalid',
        protocol: null,
        hostname: null,
        isOfficialDomain: false,
        badgeText: 'No URL',
        labelEn: 'Link unavailable or missing',
        labelHi: 'लिंक उपलब्ध नहीं है',
      };
    }
    try {
      const parsed = new URL(trimmed);
      const protocol = parsed.protocol.toLowerCase();
      const hostname = parsed.hostname.toLowerCase();
      const isHttps = protocol === 'https:';
      const isOfficialDomain = OFFICIAL_GOV_SUFFIXES.some(function (suffix) {
        return hostname.endsWith(suffix) || hostname === suffix.slice(1);
      });
      if (isHttps) {
        return {
          url: parsed.href,
          isSecure: true,
          status: 'secure',
          protocol: protocol,
          hostname: hostname,
          isOfficialDomain: isOfficialDomain,
          badgeText: 'HTTPS',
          labelEn: 'Secure HTTPS connection (encrypted)',
          labelHi: 'सुरक्षित HTTPS कनेक्शन (एन्क्रिप्टेड)',
        };
      }
      return {
        url: parsed.href,
        isSecure: false,
        status: 'insecure',
        protocol: protocol,
        hostname: hostname,
        isOfficialDomain: isOfficialDomain,
        badgeText: protocol === 'http:' ? 'HTTP · Insecure' : 'Insecure',
        labelEn: 'Insecure non-HTTPS link (unencrypted)',
        labelHi: 'असुरक्षित गैर-HTTPS लिंक (बिना एन्क्रिप्शन)',
      };
    } catch {
      return {
        url: trimmed,
        isSecure: false,
        status: 'invalid',
        protocol: null,
        hostname: null,
        isOfficialDomain: false,
        badgeText: 'Invalid URL',
        labelEn: 'Malformed or unverified URL format',
        labelHi: 'अमान्य या असत्यापित URL प्रारूप',
      };
    }
  }

  function resolveExamProcessUrl(exam, processType, boardInfo) {
    const mapKey = {
      'Apply Online': exam.p,
      'Admit Card': exam.a,
      Result: exam.r,
      'Answer Key': exam.k,
    };
    return (
      mapKey[processType] ||
      (boardInfo && boardInfo.u2 && boardInfo.u2[processType]) ||
      (boardInfo && boardInfo.url) ||
      exam.u
    );
  }

  function svgIcon(paths, cls, filled) {
    return (
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="' +
      (filled ? 'currentColor' : 'none') +
      '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' +
      (cls || 'w-4 h-4') +
      '" aria-hidden="true">' +
      paths +
      '</svg>'
    );
  }

  function buildMultiPagePDF(pages) {
    const chunks = [];
    let offset = 0;
    const xref = [0];
    const NL = String.fromCharCode(10);

    function pushStr(s) {
      const arr = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i) & 0xff;
      chunks.push(arr);
      offset += arr.length;
    }

    function pushBytes(b) {
      chunks.push(b);
      offset += b.length;
    }

    function startObj(id) {
      xref[id] = offset;
      pushStr(id + ' 0 obj' + NL);
    }

    pushStr('%PDF-1.4' + NL);
    startObj(1);
    pushStr('<< /Type /Catalog /Pages 2 0 R >>' + NL + 'endobj' + NL);

    const pageIds = [];
    let nextId = 3;
    pages.forEach(function () {
      pageIds.push(nextId);
      nextId += 3;
    });

    startObj(2);
    pushStr(
      '<< /Type /Pages /Kids [' +
        pageIds.map(function (id) { return id + ' 0 R'; }).join(' ') +
        '] /Count ' +
        pages.length +
        ' >>' +
        NL +
        'endobj' +
        NL
    );

    pages.forEach(function (p, idx) {
      const pId = pageIds[idx];
      const cId = pId + 1;
      const iId = pId + 2;

      let pw = 595;
      let ph = Math.round(595 * (p.h / p.w));
      if (ph > 842) {
        ph = 842;
        pw = Math.round(842 * (p.w / p.h));
      }

      startObj(pId);
      pushStr(
        '<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 ' +
          iId +
          ' 0 R >> >> /MediaBox [0 0 ' +
          pw +
          ' ' +
          ph +
          '] /Contents ' +
          cId +
          ' 0 R >>' +
          NL +
          'endobj' +
          NL
      );

      const stream = 'q ' + pw + ' 0 0 ' + ph + ' 0 0 cm /Im0 Do Q' + NL;
      startObj(cId);
      pushStr('<< /Length ' + stream.length + ' >>' + NL + 'stream' + NL + stream + 'endstream' + NL + 'endobj' + NL);

      startObj(iId);
      pushStr(
        '<< /Type /XObject /Subtype /Image /Width ' +
          p.w +
          ' /Height ' +
          p.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
          p.bytes.length +
          ' >>' +
          NL +
          'stream' +
          NL
      );
      pushBytes(p.bytes);
      pushStr(NL + 'endstream' + NL + 'endobj' + NL);
    });

    const xrefPos = offset;
    pushStr('xref' + NL + '0 ' + nextId + NL + '0000000000 65535 f ' + NL);
    for (let id = 1; id < nextId; id++) {
      let pos = String(xref[id]);
      while (pos.length < 10) pos = '0' + pos;
      pushStr(pos + ' 00000 n ' + NL);
    }
    pushStr('trailer' + NL + '<< /Size ' + nextId + ' /Root 1 0 R >>' + NL + 'startxref' + NL + xrefPos + NL + '%%EOF');

    return new Blob(chunks, { type: 'application/pdf' });
  }

  function matchesStatusFilter(exam, filter) {
    if (filter === 'All') return true;
    const statusText = ((exam.st || '') + ' ' + (exam.st_hi || '')).toLowerCase();
    if (filter === 'Open') {
      return (
        exam.sc === 'red' ||
        statusText.includes('application open') ||
        statusText.includes('apply open') ||
        statusText.includes('last date') ||
        statusText.includes('daf-ii') ||
        statusText.includes('closing')
      );
    }
    if (filter === 'AdmitCard') {
      return exam.sc === 'orange' && !statusText.includes('application open');
    }
    if (filter === 'AnswerKey') return exam.sc === 'blue';
    if (filter === 'Result') return exam.sc === 'green';
    return true;
  }

  function getFilteredExams() {
    const searchWords = state.searchTerm
      .toLowerCase()
      .split(/[^a-z0-9\u0900-\u097F]+/)
      .filter(Boolean);

    return state.exams.filter(function (exam) {
      if (state.onlyBookmarked && !state.bookmarkedExams.includes(exam.n)) return false;
      if (state.selectedQualification !== 'All' && exam.q !== state.selectedQualification) return false;
      if (state.selectedCategory !== 'All' && exam.c !== state.selectedCategory) return false;
      if (!matchesStatusFilter(exam, state.selectedStatus)) return false;
      if (searchWords.length === 0) return true;
      const haystack = (
        exam.n + ' ' + (exam.n_hi || '') + ' ' + exam.o + ' ' + (exam.o_hi || '') + ' ' +
        exam.c + ' ' + (exam.st || '') + ' ' + (exam.st_hi || '') + ' ' + (DATA.CATEGORY_ALIASES[exam.c] || '')
      ).toLowerCase();
      return searchWords.every(function (w) { return haystack.includes(w); });
    });
  }

  function getStatusBadgeHtml(exam) {
    const lang = state.language;
    const t = DATA.TRANSLATIONS[lang];
    let text = lang === 'hi' && exam.st_hi ? exam.st_hi : exam.st;
    let color = exam.sc;

  function runResizeAndCompress() {
    const hi = state.language === 'hi';
    if (!state.resizer.file) {
      state.resizer.error = hi ? 'कृपया पहले एक फोटो या हस्ताक्षर फाइल चुनें।' : 'Please select an image file first.';
      renderTool1Result();
      return;
    }
    state.resizer.error = '';
    state.resizer.isResizing = true;
    renderTool1Result();

    const docPresets = DATA.EXAM_DOCS_DATA[state.resizer.exam] || DATA.EXAM_DOCS_DATA['SSC'];
    const p = docPresets[state.resizer.docIndex] || docPresets[0];
    const reader = new FileReader();

    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        const cv = document.createElement('canvas');
        cv.width = p.w;
        cv.height = p.h;
        const ctx = cv.getContext('2d');
        if (!ctx) {
          state.resizer.isResizing = false;
          renderTool1Result();
          return;
        }
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, p.w, p.h);

        const nameTxt = p.photo ? state.resizer.stampName.trim().toUpperCase() : '';
        const dateTxt = p.photo ? state.resizer.stampDate.trim() : '';
        const hasStamp = Boolean(nameTxt || dateTxt);
        const stripH = hasStamp ? Math.round(p.h * 0.22) : 0;
        const imgAreaH = p.h - stripH;

        const scale = Math.min(p.w / img.width, imgAreaH / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        ctx.drawImage(img, (p.w - dw) / 2, (imgAreaH - dh) / 2, dw, dh);

        if (stripH > 0) {
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0, imgAreaH, p.w, stripH);
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(0, imgAreaH);
          ctx.lineTo(p.w, imgAreaH);
          ctx.stroke();

          ctx.fillStyle = '#0F172A';
          ctx.textAlign = 'center';
          const fontSize = Math.max(10, Math.round(stripH * 0.36));
          ctx.font = 'bold ' + fontSize + "px 'Plus Jakarta Sans', Arial, sans-serif";

          if (nameTxt && dateTxt) {
            ctx.fillText(nameTxt, p.w / 2, imgAreaH + stripH * 0.44, p.w - 8);
            ctx.fillText('DOP: ' + dateTxt, p.w / 2, imgAreaH + stripH * 0.86, p.w - 8);
          } else {
            ctx.fillText(nameTxt || 'DOP: ' + dateTxt, p.w / 2, imgAreaH + stripH * 0.65, p.w - 8);
          }
        }

        let q = 0.94;
        let dataUrl = cv.toDataURL('image/jpeg', q);
        let sizeKB = Math.max(1, Math.round(((dataUrl.length * 3) / 4) / 1024));
        while (sizeKB > p.maxKB && q > 0.12) {
          q -= 0.06;
          dataUrl = cv.toDataURL('image/jpeg', q);
          sizeKB = Math.max(1, Math.round(((dataUrl.length * 3) / 4) / 1024));
        }

        state.resizer.result = { url: dataUrl, sizeKB: sizeKB, w: p.w, h: p.h };
        state.resizer.isResizing = false;
        renderTool1Result();
      };
      img.onerror = function () {
        state.resizer.isResizing = false;
        state.resizer.error = hi ? 'फोटो पढ़ने में त्रुटि। कृपया JPG या PNG फाइल चुनें।' : 'Unable to read image. Please pick a valid JPG or PNG file.';
        renderTool1Result();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(state.resizer.file);
  }

  function runCalculateAge() {
    const hi = state.language === 'hi';
    if (!state.age.dob || !state.age.cutoffDate) {
      state.age.error = hi ? 'कृपया जन्म तिथि और कट-ऑफ तिथि दोनों भरें।' : 'Please enter both Date of Birth and Cutoff Date.';
      state.age.result = null;
      renderTool2Result();
      return;
    }
    const dDob = new Date(state.age.dob + 'T00:00:00');
    const dCut = new Date(state.age.cutoffDate + 'T00:00:00');
    if (dDob > dCut) {
      state.age.error = hi ? 'जन्म तिथि कट-ऑफ तिथि से बाद की नहीं हो सकती।' : 'Date of birth cannot be after the cutoff date.';
      state.age.result = null;
      renderTool2Result();
      return;
    }
    state.age.error = '';

    let yrs = dCut.getFullYear() - dDob.getFullYear();
    let mos = dCut.getMonth() - dDob.getMonth();
    let days = dCut.getDate() - dDob.getDate();
    if (days < 0) {
      mos--;
      const prevMonth = new Date(dCut.getFullYear(), dCut.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (mos < 0) {
      yrs--;
      mos += 12;
    }
    const exactDecimal = yrs + mos / 12 + days / 365.25;
    const effectiveMax = state.age.maxAge + state.age.catRelaxation;
    const isEligible = exactDecimal >= state.age.minAge && (yrs < effectiveMax || (yrs === effectiveMax && mos === 0 && days === 0));

    state.age.result = {
      years: yrs,
      months: mos,
      days: days,
      eligible: isEligible,
      effectiveMax: effectiveMax,
      minAge: state.age.minAge,
    };
    renderTool2Result();
  }

  function runCreatePdf() {
    const hi = state.language === 'hi';
    if (!state.pdf.files.length) {
      state.pdf.error = hi ? 'कृपया कम से कम 1 दस्तावेज फोटो चुनें।' : 'Please select at least 1 document image.';
      renderTool3Result();
      return;
    }
    state.pdf.error = '';
    state.pdf.isMaking = true;
    renderTool3Result();

    const maxTotalBytes = state.pdf.targetKB * 1024;
    const perImgBytes = Math.floor((maxTotalBytes - 2048) / state.pdf.files.length);

    Promise.all(
      state.pdf.files.slice(0, 5).map(function (f) {
        return new Promise(function (resolve, reject) {
          const r = new FileReader();
          r.onload = function (ev) {
            const im = new Image();
            im.onload = function () {
              const maxW = 900;
              const scale = Math.min(1, maxW / im.width);
              const w = Math.round(im.width * scale);
              const h = Math.round(im.height * scale);
              const cv = document.createElement('canvas');
              cv.width = w;
              cv.height = h;
              const ctx = cv.getContext('2d');
              if (!ctx) return reject(new Error('Canvas context unavailable'));

              ctx.fillStyle = '#FFFFFF';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(im, 0, 0, w, h);

              let q = 0.82;
              let dUrl = cv.toDataURL('image/jpeg', q);
              while (dUrl.length * 0.75 > perImgBytes && q > 0.15) {
                q -= 0.08;
                dUrl = cv.toDataURL('image/jpeg', q);
              }
              const bin = atob(dUrl.split(',')[1]);
              const bytes = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              resolve({ bytes: bytes, w: w, h: h });
            };
            im.onerror = function () { reject(new Error('Invalid image file')); };
            im.src = ev.target.result;
          };
          r.onerror = function () { reject(new Error('Read error')); };
          r.readAsDataURL(f);
        });
      })
    )
      .then(function (pages) {
        if (state.pdf.result && state.pdf.result.url) {
          try { URL.revokeObjectURL(state.pdf.result.url); } catch {}
        }
        const pdfBlob = buildMultiPagePDF(pages);
        const url = URL.createObjectURL(pdfBlob);
        const kb = Math.max(1, Math.round(pdfBlob.size / 1024));
        state.pdf.result = { url: url, sizeKB: kb, pages: pages.length };
        state.pdf.isMaking = false;
        renderTool3Result();
      })
      .catch(function () {
        state.pdf.isMaking = false;
        state.pdf.error = hi ? 'PDF बनाने में त्रुटि। कृपया दूसरी फोटो चुनकर प्रयास करें।' : 'Error creating PDF. Please try different images.';
        renderTool3Result();
      });
  }

  function bindToolsEvents() {
    const hi = state.language === 'hi';
    const t1Exam = document.getElementById('t1-exam');
    const t1Doc = document.getElementById('t1-doc');
    const t1File = document.getElementById('t1-file');
    const t1Name = document.getElementById('t1-name');
    const t1Date = document.getElementById('t1-date');
    const t1Btn = document.getElementById('tool1-run-btn');
    const t1StampWrap = document.getElementById('t1-stamp-wrap');

    if (t1Exam) {
      t1Exam.addEventListener('change', function (e) {
        state.resizer.exam = e.target.value;
        state.resizer.docIndex = 0;
        state.resizer.result = null;
        state.resizer.error = '';
        const docPresets = DATA.EXAM_DOCS_DATA[state.resizer.exam] || DATA.EXAM_DOCS_DATA['SSC'];
        if (t1Doc) {
          t1Doc.innerHTML = docPresets.map(function (d, i) {
            return '<option value="' + i + '">' + esc(hi && d.label_hi ? d.label_hi : d.label) + '</option>';
          }).join('');
        }
        if (t1StampWrap) t1StampWrap.classList.toggle('hidden', !(docPresets[0] && docPresets[0].photo));
        renderTool1Result();
      });
    }
    if (t1Doc) {
      t1Doc.addEventListener('change', function (e) {
        state.resizer.docIndex = Number(e.target.value) || 0;
        const docPresets = DATA.EXAM_DOCS_DATA[state.resizer.exam] || DATA.EXAM_DOCS_DATA['SSC'];
        const p = docPresets[state.resizer.docIndex] || docPresets[0];
        if (t1StampWrap) t1StampWrap.classList.toggle('hidden', !(p && p.photo));
      });
    }
    if (t1File) {
      t1File.addEventListener('change', function (e) {
        if (e.target.files && e.target.files[0]) {
          state.resizer.file = e.target.files[0];
          state.resizer.result = null;
          state.resizer.error = '';
          renderTool1Result();
        }
      });
    }
    if (t1Name) t1Name.addEventListener('input', function (e) { state.resizer.stampName = e.target.value; });
    if (t1Date) t1Date.addEventListener('input', function (e) { state.resizer.stampDate = e.target.value; });
    if (t1Btn) t1Btn.addEventListener('click', runResizeAndCompress);

    const t2Preset = document.getElementById('t2-preset');
    const t2Dob = document.getElementById('t2-dob');
    const t2Cut = document.getElementById('t2-cutoff');
    const t2Min = document.getElementById('t2-min');
    const t2Max = document.getElementById('t2-max');
    const t2Relax = document.getElementById('t2-relax');
    const t2Btn = document.getElementById('tool2-run-btn');

    if (t2Preset) {
      t2Preset.addEventListener('change', function (e) {
        const idx = Number(e.target.value) || 0;
        state.age.presetIndex = idx;
        const p = DATA.AGE_PRESETS_DATA[idx];
        if (p) {
          state.age.minAge = p.min;
          state.age.maxAge = p.max;
          state.age.cutoffDate = p.cut;
          state.age.result = null;
          state.age.error = '';
          if (t2Min) t2Min.value = String(p.min);
          if (t2Max) t2Max.value = String(p.max);
          if (t2Cut) t2Cut.value = p.cut;
          renderTool2Result();
        }
      });
    }
    if (t2Dob) t2Dob.addEventListener('change', function (e) { state.age.dob = e.target.value; });
    if (t2Cut) t2Cut.addEventListener('change', function (e) { state.age.cutoffDate = e.target.value; });
    if (t2Min) t2Min.addEventListener('input', function (e) { state.age.minAge = parseFloat(e.target.value) || 0; });
    if (t2Max) t2Max.addEventListener('input', function (e) { state.age.maxAge = parseInt(e.target.value, 10) || 100; });
    if (t2Relax) t2Relax.addEventListener('change', function (e) { state.age.catRelaxation = Number(e.target.value) || 0; });
    if (t2Btn) t2Btn.addEventListener('click', runCalculateAge);

    const t3Kb = document.getElementById('t3-kb');
    const t3Files = document.getElementById('t3-files');
    const t3Btn = document.getElementById('tool3-run-btn');
    if (t3Kb) t3Kb.addEventListener('change', function (e) { state.pdf.targetKB = Number(e.target.value) || 280; });
    if (t3Files) {
      t3Files.addEventListener('change', function (e) {
        if (e.target.files) {
          state.pdf.files = Array.from(e.target.files).slice(0, 5);
          state.pdf.result = null;
          state.pdf.error = '';
          renderTool3Result();
        }
      });
    }
    if (t3Btn) t3Btn.addEventListener('click', runCreatePdf);
  }

  function runSheetSync() {
    const url = state.sheetUrl.trim();
    if (!url) {
      state.sheetStatus = { type: 'error', message: 'Please enter a valid Google Sheet CSV URL.' };
      renderSheetSyncModal();
      return;
    }
    state.sheetLoading = true;
    state.sheetStatus = null;
    renderSheetSyncModal();

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error('Failed to fetch sheet: HTTP ' + res.status);
        return res.text();
      })
      .then(function (csv) {
        const rows = csv
          .trim()
          .split(/\r?\n/)
          .map(function (row) {
            return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(function (cell) {
              return cell.replace(/^"|"$/g, '').trim();
            });
          });
        if (rows.length < 2) throw new Error('CSV sheet appears empty or has only header row.');
        const headers = rows.shift() || [];
        const liveExams = rows
          .map(function (row) {
            const obj = {};
            headers.forEach(function (h, idx) {
              if (row[idx]) obj[h] = row[idx];
            });
            return obj;
          })
          .filter(function (item) { return item.n && item.u; });

        if (liveExams.length === 0) {
          throw new Error('No valid exams found. Ensure columns contain "n" (Exam Name) and "u" (Portal URL).');
        }
        state.exams = liveExams;
        renderFiltersAndGrid();
        state.sheetLoading = false;
        state.sheetStatus = {
          type: 'success',
          message: 'Successfully synchronized ' + liveExams.length + ' exams from Google Sheet!',
        };
        renderSheetSyncModal();
        setTimeout(function () {
          state.isSheetSyncOpen = false;
          renderSheetSyncModal();
        }, 1500);
      })
      .catch(function (err) {
        state.sheetLoading = false;
        state.sheetStatus = {
          type: 'error',
          message: (err && err.message) || 'Error parsing Google Sheet CSV. Ensure the sheet is Published to Web as CSV.',
        };
        renderSheetSyncModal();
      });
  }

  function hasWholeWord(hay, word) {
    const escaped = String(word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp('(?:^|[^a-z0-9\u0900-\u097f])' + escaped + '(?:$|[^a-z0-9\u0900-\u097f])', 'i').test(hay);

      { re: /\bbssc\b/, match: function (n) { return n.startsWith('bssc'); } },
      { re: /\bbihar\s*police\b|\bcsbc\b|\bbpssc\b/, match: function (n) { return n.startsWith('bihar police'); } },
      { re: /\buppsc\b/, match: function (n) { return n.startsWith('uppsc'); } },
      { re: /\bupsssc\b|\bpet\b/, match: function (n) { return n.startsWith('upsssc'); } },
      { re: /\bup\s*police\b|\bupprpb\b/, match: function (n) { return n.startsWith('up police'); } },
      { re: /\bjpsc\b/, match: function (n) { return n.startsWith('jpsc'); } },
      { re: /\bjssc\b/, match: function (n) { return n.startsWith('jssc'); } },
      { re: /\bmppsc\b/, match: function (n) { return n.startsWith('mppsc'); } },
      { re: /\bmpesb\b|\bvyapam\b|\bmp\s*patwari\b/, match: function (n) { return n.startsWith('mpesb'); } },
      { re: /\brpsc\b|\bras\b/, match: function (n) { return n.startsWith('rpsc'); } },
      { re: /\brssb\b|\brsmssb\b|\breet\b/, match: function (n) { return n.startsWith('rssb'); } },
      { re: /\bhpsc\b|\bhcs\b/, match: function (n) { return n.startsWith('hpsc'); } },
      { re: /\bhssc\b/, match: function (n) { return n.startsWith('hssc'); } },
      { re: /\bppsc\b/, match: function (n) { return n.startsWith('ppsc'); } },
      { re: /\bpsssb\b|\bpunjab\s*police\b/, match: function (n) { return n.startsWith('psssb'); } },
      { re: /\bagniveer\b|\bindian\s*army\b/, match: function (n) { return n.includes('agniveer'); } },
    ];

    const scored = [];
    state.exams.forEach(function (exam) {
      const nameL = (exam.n || '').toLowerCase();
      const nameHi = (exam.n_hi || '').toLowerCase();
      const orgL = (exam.o || '').toLowerCase();
      const catL = (exam.c || '').toLowerCase();
      const aliasL = (DATA.CATEGORY_ALIASES[exam.c] || '').toLowerCase();
      let score = 0;

      specificRules.forEach(function (rule) {
        if (rule.re.test(q) && rule.match(nameL)) {
          score += 220;
        }
      });

      if (hasWholeWord(cleanQ, 'ssc') && nameL.indexOf('ssc ') === 0 && !/\bssc\s*(cgl|chsl|mts|gd|cpo)\b/.test(q)) {
        score += 110 + (nameL.startsWith('ssc cgl') ? 25 : 0);
      }
      if (hasWholeWord(cleanQ, 'ibps') && nameL.indexOf('ibps ') === 0 && !/\bibps\s*(po|clerk|rrb|so)\b/.test(q)) {
        score += 110 + (nameL.startsWith('ibps po') ? 25 : 0);
      }
      if (hasWholeWord(cleanQ, 'upsc') && nameL.indexOf('upsc ') === 0 && !/\bupsc\s*(cse|ias|ips|nda|cds|capf)\b/.test(q)) {
        score += 110 + (nameL.startsWith('upsc civil') ? 25 : 0);
      }
      if (hasWholeWord(cleanQ, 'rrb') && nameL.indexOf('rrb ') === 0 && !/\brrb\s*(ntpc|group|alp|je)\b/.test(q)) {
        score += 110 + (nameL.startsWith('rrb ntpc') ? 25 : 0);
      }

      tokens.forEach(function (tok) {
        if (hasWholeWord(nameL, tok) || (nameHi && hasWholeWord(nameHi, tok))) {
          score += 40;
        } else if (hasWholeWord(orgL, tok)) {
          score += 18;
        } else if (hasWholeWord(catL, tok)) {
          score += 12;
        } else if (hasWholeWord(aliasL, tok)) {
          score += 5;
        }
      });

      if (score > 0) {
        scored.push({ exam: exam, score: score });
      }
    });

    scored.sort(function (a, b) { return b.score - a.score; });
    if (scored.length === 0) return [];

    const topScore = scored[0].score;
    if (topScore >= 200) {
      return scored.filter(function (item) { return item.score >= 200; }).slice(0, 4).map(function (i) { return i.exam; });
    }
    if (topScore >= 100) {
      const topPool = scored.filter(function (item) { return item.score >= 100; });
      const seenCat = {};
      const diverse = [];
      topPool.forEach(function (item) {
        if (!seenCat[item.exam.c]) {
          seenCat[item.exam.c] = true;
          diverse.push(item.exam);
        }
      });
      topPool.forEach(function (item) {
        if (diverse.indexOf(item.exam) < 0 && diverse.length < 4) diverse.push(item.exam);
      });
      return diverse.slice(0, 4);
    }
    return scored.filter(function (item) { return item.score >= Math.max(12, topScore * 0.65); }).slice(0, 4).map(function (i) { return i.exam; });
  }

  function buildLocalVerifiedFallback(query, noticeMsg, lang, roleMode) {
    const q = String(query || '').toLowerCase();

    const wantsStrategy = /\b(30[- ]?day|strategy|plan|revision|prepare|preparation|timetable|schedule|study)\b|रणनीति|तैयारी|योजना|रिवीजन/.test(q) || roleMode === 'strategy_coach';

    const wantsCutoff = /\b(cut[- ]?off|cutoffs|safe\s*score|qualifying|marks|merit)\b|कट-?ऑफ|स्कोर|अंक/.test(q) || roleMode === 'strategy_coach';
    const wantsDocs = /\b(photo|sign|signature|kb|px|pixel|pdf|thumb|declaration|postcard|form|upload|size|dimension|document)\b|फोटो|हस्ताक्षर|साइज|पीडीएफ|दस्तावेज/.test(q) || roleMode === 'quick_tutor';
    const wantsAge = /\b(age|eligibility|relaxation|obc|sc|st|ews|pwbd|dob|birth)\b|आयु|छूट|योग्यता|पात्रता/.test(q);

    const sources = [];
    const lines = [];
    if (noticeMsg) lines.push(noticeMsg);

    if (matched.length > 0) {

          : '**Verified Exam Details from ExamSetu & Toolkit Catalog (' + DATA.VERIFIED_DATE + '):**'

      matched.forEach(function (ex, idx) {

        if (idx > 0) lines.push('', '---');
        lines.push('### ' + name + ' (' + ex.o + ')');
        lines.push('- **' + (hi ? 'ताजा स्थिति' : 'Current Status') + ':** ' + status);

        if (ex.d && ex.d.dates && ex.d.dates.length > 0) {
          const dRows = hi && ex.d.dates_hi ? ex.d.dates_hi : ex.d.dates;
          dRows.slice(0, 4).forEach(function (row) {
            lines.push('  - ' + row[0] + ': ' + row[1]);
          });
        }

        if (wantsSyllabus) {
          lines.push('', '**' + (hi ? 'परीक्षा पैटर्न व सिलेबस:' : 'Exam Pattern & Syllabus Breakdown:') + '**');
          (hi ? pb.patternHi : pb.patternEn).forEach(function (pLine) {
            lines.push('- ' + pLine);
          });
        }

        if (wantsCutoff) {
          lines.push('', '**' + (hi ? 'अपेक्षित कट-ऑफ व सेफ स्कोर:' : 'Expected Cutoff & Safe Score:') + '**');
          lines.push('- ' + (hi ? pb.cutoffHi : pb.cutoffEn));
        }

        if (wantsStrategy) {
          lines.push('', '**' + (hi ? '30-दिन की लक्षित तैयारी रणनीति:' : 'Tailored 30-Day Revision Strategy:') + '**');
          (hi ? pb.strategyHi : pb.strategyEn).forEach(function (sLine) {
            lines.push('- ' + sLine);
          });
        }

        if (wantsDocs || (!wantsStrategy && !wantsCutoff && !wantsSyllabus && idx === 0)) {
          lines.push('', '**' + (hi ? 'फोटो, हस्ताक्षर व दस्तावेज नियम (' + pb.docBoard + ' मानक):' : 'Photo, Signature & Form Rules (' + pb.docBoard + ' Preset):') + '**');
          docSpecs.forEach(function (spec) {
            lines.push('- ' + (hi && spec.label_hi ? spec.label_hi : spec.label));
          });
          lines.push('- ' + (hi ? pb.docNoteHi : pb.docNoteEn));
        }

        if (ex.u) sources.push({ title: ex.n + ' Official Portal', uri: ex.u });
        if (ex.a && ex.a !== ex.u) sources.push({ title: ex.n + ' Admit Card', uri: ex.a });
        if (ex.r && ex.r !== ex.u) sources.push({ title: ex.n + ' Result', uri: ex.r });
        if (ex.f && ex.f !== ex.u) sources.push({ title: ex.n + ' Notification', uri: ex.f });
      });

      if (wantsAge) {
        lines.push(
          '',
          hi
            ? '**आयु सीमा व श्रेणी छूट (सरकारी मानदंड):** सामान्य/EWS +0 वर्ष | OBC (NCL) +3 वर्ष | SC/ST +5 वर्ष | PwBD +10/+13/+15 वर्ष। सटीक कट-ऑफ जांच हेतु नीचे **Age & Eligibility Calculator** का उपयोग करें।'
            : '**Age Limit & Category Relaxation:** General/EWS +0 yrs | OBC (NCL) +3 yrs | SC/ST +5 yrs | PwBD +10/+13/+15 yrs. Verify exact DOB eligibility in the **Age Calculator** below.'
        );

    } else if (wantsDocs) {

      ['SSC', 'IBPS', 'RRB', 'UPSC', 'NTA', 'BPSC'].forEach(function (board) {

        const summary = specs.map(function (s) { return hi && s.label_hi ? s.label_hi : s.label; }).join(' | ');
        lines.push('- **' + board + ':** ' + summary);
      });
      lines.push(
        '',
        hi
          ? 'नीचे पेज पर मौजूद **Photo & Sign Resizer** और **Photo to PDF (<300 KB)** टूल्स से 100% ऑफलाइन और सुरक्षित तरीके से फाइलें तैयार करें।'
          : 'Use the **Photo & Sign Resizer** and **Photo to PDF (<300 KB)** tools on this page 100% offline with exact presets.'
      );
    } else if (wantsAge) {
      lines.push(

        hi
          ? '**आयु सीमा व आरक्षण छूट नियम:**\n- सामान्य / EWS: 0 वर्ष अतिरिक्त छूट\n- OBC (NCL): +3 वर्ष अतिरिक्त छूट\n- SC / ST: +5 वर्ष अतिरिक्त छूट\n- दिव्यांग (PwBD): +10 वर्ष (सामान्य), +13 वर्ष (OBC), +15 वर्ष (SC/ST)\n- सटीक गणना के लिए नीचे पेज पर **Age & Eligibility Calculator** का उपयोग करें।'
          : '**Age Limit & Category Relaxation Rules:**\n- General / EWS: +0 Years\n- OBC (Non-Creamy Layer): +3 Years\n- SC / ST: +5 Years\n- PwBD: +10 Years (Gen), +13 Years (OBC), +15 Years (SC/ST)\n- Use the **Age & Eligibility Calculator** below to verify exact cutoff dates.'
      );
    } else {
      lines.push(
        '',
        hi
          ? 'कृपया किसी विशिष्ट परीक्षा का नाम लिखें (जैसे **RRB NTPC**, **SSC CGL**, **SSC MTS**, **SSC CPO**, **IBPS PO**, **BPSC**, **BSSC**, **NEET**, **CUET**, **UPSC**)। आप किसी भी परीक्षा के लिए **30-दिन की रणनीति, सिलेबस, अपेक्षित कट-ऑफ या फोटो/हस्ताक्षर नियम** पूछ सकते हैं।'
          : 'Ask about any specific exam such as **RRB NTPC**, **SSC CGL**, **SSC MTS**, **SSC CPO**, **IBPS PO/Clerk**, **BPSC**, **BSSC**, **NEET**, **CUET**, or **UPSC** for tailored **30-day revision plans, syllabus breakdowns, expected cutoffs, and photo/signature form rules**.'
      );
    }

    const seenUri = {};
    const dedupSources = sources.filter(function (s) {
      if (!s.uri || seenUri[s.uri]) return false;
      seenUri[s.uri] = true;
      return true;
    });

    return { text: lines.join('\n'), sources: dedupSources.slice(0, 6) };
  }

  function renderFormattedLine(line) {
    const tokenRegex = /(\[[^\]]+\]\(https?:\/\/[^)\s]+\)|\*\*[^*]+\*\*|\*[^*\n]+\*|`[^`]+`)/g;
    let out = '';
    let lastIdx = 0;
    let match;
    while ((match = tokenRegex.exec(line)) !== null) {
      if (match.index > lastIdx) out += esc(line.slice(lastIdx, match.index));
      const part = match[0];
      const linkMatch = part.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/);
      if (linkMatch) {
        out += '<a href="' + esc(safeHref(linkMatch[2])) + '" target="_blank" rel="noopener noreferrer" class="text-rose-700 dark:text-amber-300 underline font-semibold hover:text-rose-900 dark:hover:text-amber-200 break-words">' + esc(linkMatch[1]) + '</a>';
      } else if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
        out += '<strong class="font-bold text-slate-900 dark:text-white">' + esc(part.slice(2, -2)) + '</strong>';
      } else if (part.startsWith('*') && part.endsWith('*') && part.length > 2) {
        out += '<em class="italic text-slate-600 dark:text-slate-300">' + esc(part.slice(1, -1)) + '</em>';
      } else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
        out += '<code class="px-1 py-0.5 rounded bg-slate-200/70 dark:bg-slate-700/70 font-mono text-[11px]">' + esc(part.slice(1, -1)) + '</code>';
      } else {
        out += esc(part);
      }
      lastIdx = tokenRegex.lastIndex;
    }
    if (lastIdx < line.length) out += esc(line.slice(lastIdx));
    return out;
  }

  function renderFormattedText(text) {
    return String(text || '').split('\n').map(function (line) {
      const trimmed = line.trim();
      if (!trimmed) return '<div class="h-1"></div>';
      if (trimmed === '---' || trimmed === '***') return '<hr class="border-slate-200 dark:border-slate-800 my-2" />';
      if (trimmed.startsWith('### ')) return '<h4 class="font-bold text-rose-900 dark:text-amber-300 text-xs sm:text-sm pt-1">' + renderFormattedLine(trimmed.slice(4)) + '</h4>';
      if (trimmed.startsWith('## ')) return '<h3 class="font-extrabold text-rose-950 dark:text-amber-200 text-sm pt-1">' + renderFormattedLine(trimmed.slice(3)) + '</h3>';
      if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
        return '<div class="flex items-start gap-2 pl-1"><span class="text-amber-500 font-bold mt-0.5">&bull;</span><span>' + renderFormattedLine(trimmed.slice(2)) + '</span></div>';
      }
      return '<p>' + renderFormattedLine(line) + '</p>';
    }).join('');
  }

    if (!state.isChatOpen) {
      mount.innerHTML = '';
      syncBodyScrollLock();
      return;
    }
    syncBodyScrollLock();

    const hi = state.language === 'hi';
    const activeRoleMeta = CHAT_ROLES.find(function (r) { return r.id === state.chatRoleMode; }) || CHAT_ROLES[0];

    mount.innerHTML =
      '<div data-backdrop="chat" class="fixed inset-0 z-50 bg-black/65 flex items-end sm:items-center justify-center p-0 sm:p-4">' +
      '<div class="et-modal-sheet bg-white dark:bg-slate-900 border-t-4 sm:border sm:border-t-4 border-amber-500 rounded-t-3xl sm:rounded-2xl max-w-2xl w-full h-[92dvh] sm:h-[82dvh] max-h-full flex flex-col shadow-2xl text-slate-900 dark:text-slate-100 overflow-hidden">' +
      '<div class="p-4 sm:px-5 sm:py-4 bg-gradient-to-r from-rose-950 via-rose-900 to-rose-950 text-white border-b border-amber-500/30 shrink-0">' +
      '<div class="flex items-start justify-between gap-3">' +
      '<div class="flex items-center gap-2.5 min-w-0">' +
      '<div class="w-9 h-9 rounded-xl bg-amber-500 text-rose-950 flex items-center justify-center shadow-xs shrink-0">' + icon('sparkles', 'w-5 h-5') + '</div>' +
      '<div class="min-w-0">' +
      '<h2 class="text-base sm:text-lg font-black tracking-tight text-white flex flex-wrap items-center gap-2"><span>ExamSetu &amp; Toolkit AI</span>' +
      '<span id="chat-role-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-400/20 text-amber-300 border border-amber-400/30">' + esc(activeRoleMeta.badge) + '</span></h2>' +
      '<p id="chat-role-desc" class="text-[11px] sm:text-xs text-rose-200/90 truncate">' + esc(hi ? activeRoleMeta.descHi : activeRoleMeta.descEn) + '</p></div></div>' +
      '<div class="flex items-center gap-1.5 shrink-0">' +
      '<button type="button" id="chat-clear-btn" data-action="chat-clear" class="et-icon-btn p-2 rounded-lg bg-white/10 hover:bg-white/20 text-rose-100 hover:text-white transition-colors cursor-pointer ' + (state.chatMessages.length ? '' : 'hidden') + '" title="' + esc(hi ? 'चैट साफ़ करें' : 'Clear conversation') + '">' + icon('trash2', 'w-4 h-4') + '</button>' +
      '<button type="button" data-action="close-chat" class="et-icon-btn p-2 rounded-lg bg-white/10 hover:bg-white/20 text-white transition-colors cursor-pointer" aria-label="Close AI Assistant">' + icon('x', 'w-5 h-5') + '</button>' +
      '</div></div>' +
      '<div id="chat-roles-row" class="mt-3 flex items-center gap-1.5 overflow-x-auto et-scroll-strip pb-0.5">' +
      CHAT_ROLES.map(function (opt) {
        const isSel = state.chatRoleMode === opt.id;
        return '<button type="button" data-chat-role="' + opt.id + '" class="et-filter-chip px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-colors cursor-pointer whitespace-nowrap shrink-0 ' +
          (isSel ? 'bg-amber-500 text-rose-950 shadow-xs' : 'bg-white/10 text-rose-100 hover:bg-white/20') + '">' +
          icon(opt.icon, 'w-3.5 h-3.5') + '<span>' + esc(hi ? opt.labelHi : opt.labelEn) + '</span></button>';
      }).join('') +
      '</div></div>' +
      '<div id="chat-thread-body" class="flex-1 overflow-y-auto overscroll-contain p-4 sm:p-5 space-y-4 bg-slate-50/70 dark:bg-slate-950/60"></div>' +
      '<form id="chat-form" class="p-3 sm:p-4 et-modal-footer-safe bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shrink-0">' +
      '<div class="flex items-end gap-2">' +
      '<textarea id="chat-input" rows="2" placeholder="' + esc(hi ? 'परीक्षा तिथि, एडमिट कार्ड, कट-ऑफ या फोटो साइज के बारे में पूछें...' : 'Ask about live exam dates, admit cards, cutoffs, or form rules...') + '" class="flex-1 resize-none rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-base sm:text-sm text-slate-900 dark:text-white focus:outline-none focus:border-amber-500">' + esc(state.chatInput) + '</textarea>' +
      '<button type="submit" id="chat-send-btn" class="min-h-[44px] h-11 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-rose-950 font-bold text-xs sm:text-sm flex items-center gap-1.5 transition-colors cursor-pointer shrink-0 shadow-xs">' +
      icon('send', 'w-4 h-4') + '<span class="hidden sm:inline">' + esc(hi ? 'भेजें' : 'Send') + '</span></button></div>' +
      '<p class="text-[10px] text-slate-400 mt-1.5 text-center">' + esc(hi ? 'प्राप्त जानकारी की पुष्टि हमेशा संबंधित आयोग की आधिकारिक वेबसाइट पर करें।' : 'Always verify final dates and rules on official commission portals.') + '</p>' +
      '</form></div></div>';

    renderChatThreadOnly();

    const inp = document.getElementById('chat-input');
    const form = document.getElementById('chat-form');
    const sendBtn = document.getElementById('chat-send-btn');

    function syncSendBtn() {
      if (sendBtn) sendBtn.disabled = !state.chatInput.trim() || state.chatLoading;
    }
    syncSendBtn();

    if (inp) {
      inp.addEventListener('input', function (e) {
        state.chatInput = e.target.value;
        syncSendBtn();
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendChatMessage(state.chatInput);
        }
      });
      if (window.innerWidth >= 768) {
        setTimeout(function () { inp.focus(); }, 80);
      }
    }
    if (form) {
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        sendChatMessage(state.chatInput);
      });
    }
  }

  function pushLocalFallbackMessage(trimmed, noticeMsg, fallbackNote, activeRole) {
    const fallback = buildLocalVerifiedFallback(trimmed, noticeMsg, state.language, activeRole);
    state.chatMessages.push({
      id: 'loc_' + Date.now(),
      role: 'model',
      text: fallback.text,
      sources: fallback.sources,
      modelUsed: 'Local Verified Catalog',
      fallbackNote: fallbackNote || undefined,
    });
  }

  function sendChatMessage(rawText, overrideRole) {
    const trimmed = String(rawText || '').trim();
    if (!trimmed || state.chatLoading) return;
    const activeRole = overrideRole || state.chatRoleMode;
    const hi = state.language === 'hi';

    state.chatMessages.push({
      id: 'u_' + Date.now(),
      role: 'user',
      text: trimmed,
    });
    state.chatInput = '';
    const inp = document.getElementById('chat-input');
    if (inp) inp.value = '';
    state.chatLoading = true;
    renderChatThreadOnly();
    const sendBtn = document.getElementById('chat-send-btn');
    if (sendBtn) sendBtn.disabled = true;

    const apiMessages = state.chatMessages
      .filter(function (m) { return !m.isError; })
      .map(function (m) { return { role: m.role, text: m.text }; });

    const isStaticHost =
      window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:';

    if (isStaticHost) {
      setTimeout(function () {
        pushLocalFallbackMessage(
          trimmed,
          '',
          hi ? 'सत्यापित ऑफलाइन कैटलॉग सहायक' : 'Verified Local Catalog Assistant',
          activeRole
        );
        state.chatLoading = false;
        renderChatThreadOnly();
        if (sendBtn) sendBtn.disabled = !state.chatInput.trim();
      }, 150);
      return;
    }

    fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: apiMessages,
        roleMode: activeRole,
        language: state.language,
      }),
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          return { res: res, data: data };
        });
      })
      .then(function (out) {
        const res = out.res;
        const data = out.data;
        if (res.ok && data && data.reply) {
          state.chatMessages.push({
            id: 'm_' + Date.now(),
            role: 'model',
            text: data.reply,
            sources: Array.isArray(data.sources) ? data.sources : [],
            modelUsed: data.modelUsed,
            fallbackNote: data.fallbackNote,
          });
          return;
        }
        pushLocalFallbackMessage(
          trimmed,
          '',
          (data && data.error) || (hi ? 'स्थानीय सत्यापित कैटलॉग से उत्तर:' : 'Tailored answer from Local Verified Catalog:'),
          activeRole
        );
      })
      .catch(function () {
        pushLocalFallbackMessage(
          trimmed,
          '',
          hi ? 'सत्यापित स्थानीय कैटलॉग से उत्तर:' : 'Verified Local Catalog Response:',
          activeRole
        );
      })
      .finally(function () {
        state.chatLoading = false;
        renderChatThreadOnly();
        if (sendBtn) sendBtn.disabled = !state.chatInput.trim();
      });
  }

  function renderAll() {
    renderHeader();
    renderSpotlight();
    renderSearchBar();
    renderFiltersAndGrid();
    renderStudentTools();
    renderFooter();
    renderFloatingAiButton();
    renderDetailModal();
    renderProcessGuideModal();
    renderSheetSyncModal();
    renderLegalModal();
    renderChatModal();
  }

  rootEl.innerHTML =
    '<div class="min-h-screen w-full max-w-full box-border overflow-x-clip flex flex-col bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 transition-colors">' +
    '<div id="header-mount"></div>' +
    '<main class="flex-1 max-w-6xl w-full min-w-0 mx-auto px-3 sm:px-6 py-5 sm:py-8 space-y-8 box-border">' +
    '<div id="spotlight-mount"></div>' +
    '<section id="exams-list" class="space-y-6 w-full max-w-full min-w-0 box-border">' +
    '<div id="search-wrap-mount"></div>' +
    '<div id="filter-station-mount"></div>' +
    '<div id="exam-cards-mount"></div>' +
    '</section>' +
    '<div id="tools-mount"></div>' +
    '</main>' +
    '<div id="footer-mount"></div>' +
    '<div id="floating-ai-mount"></div>' +
    '<div id="detail-modal-mount"></div>' +
    '<div id="guide-modal-mount"></div>' +
    '<div id="sheet-modal-mount"></div>' +
    '<div id="legal-modal-mount"></div>' +
    '<div id="chat-modal-mount"></div>' +
    '</div>';

  renderAll();

  document.addEventListener('click', function (e) {
    const target = e.target;
    if (!(target instanceof Element)) return;

    const backdrop = target.getAttribute('data-backdrop');
    if (backdrop === 'detail') { state.selectedExam = null; state.isTooltipOpen = false; state.isTooltipPinned = false; renderDetailModal(); return; }
    if (backdrop === 'guide') { state.guideExam = null; state.guideProcess = null; renderProcessGuideModal(); return; }
    if (backdrop === 'sheet') { state.isSheetSyncOpen = false; renderSheetSyncModal(); return; }
    if (backdrop === 'legal') { state.legalPage = null; renderLegalModal(); return; }
    if (backdrop === 'chat') { state.isChatOpen = false; renderChatModal(); renderFloatingAiButton(); return; }

    if (state.isTooltipOpen) {
      const secCont = document.getElementById('url-security-container');
      if (secCont && !secCont.contains(target)) {
        state.isTooltipOpen = false;
        state.isTooltipPinned = false;
        renderTooltipBox();
      }
    }

    const btn = target.closest('[data-action],[data-scroll-target],[data-qual],[data-cat],[data-status],[data-bookmark],[data-open-exam],[data-open-guide],[data-detail-guide],[data-check-idx],[data-footer-qual],[data-legal],[data-chat-role],[data-starter-idx],[data-copy-msg]');
    if (!btn) return;

    const scrollTarget = btn.getAttribute('data-scroll-target');
    if (scrollTarget) { scrollToSection(scrollTarget); return; }

    const action = btn.getAttribute('data-action');
    if (action === 'scroll-tools') { scrollToTools(); return; }
    if (action === 'scroll-top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    if (action === 'toggle-lang') { toggleLanguage(); return; }
    if (action === 'toggle-theme') { toggleDarkMode(); return; }
    if (action === 'open-sheet') { state.isSheetSyncOpen = true; renderSheetSyncModal(); return; }
    if (action === 'close-sheet') { state.isSheetSyncOpen = false; renderSheetSyncModal(); return; }
    if (action === 'open-chat') { state.isChatOpen = true; renderChatModal(); renderFloatingAiButton(); return; }
    if (action === 'close-chat') { state.isChatOpen = false; renderChatModal(); renderFloatingAiButton(); return; }
    if (action === 'chat-clear') { state.chatMessages = []; renderChatThreadOnly(); return; }
    if (action === 'toggle-only-bookmarked') { state.onlyBookmarked = !state.onlyBookmarked; renderFiltersAndGrid(); return; }
    if (action === 'clear-filters') {
      state.searchTerm = '';
      state.selectedCategory = 'All';
      state.selectedQualification = 'All';
      state.selectedStatus = 'All';
      state.onlyBookmarked = false;
      const inp = document.getElementById('search-input');
      const clr = document.getElementById('search-clear-btn');
      if (inp) inp.value = '';
      if (clr) clr.classList.add('hidden');
      renderFiltersAndGrid();
      return;
    }
    if (action === 'close-detail') { state.selectedExam = null; state.isTooltipOpen = false; state.isTooltipPinned = false; renderDetailModal(); return; }
    if (action === 'close-tooltip') { state.isTooltipOpen = false; state.isTooltipPinned = false; renderTooltipBox(); return; }
    if (action === 'detail-bookmark' && state.selectedExam) { toggleBookmark(state.selectedExam.n); return; }
    if (action === 'detail-share' && state.selectedExam) {
      const ex = state.selectedExam;
      const hi = state.language === 'hi';
      const dName = hi && ex.n_hi ? ex.n_hi : ex.n;
      const dOrg = hi && ex.o_hi ? ex.o_hi : ex.o;
      const text = dName + ' (' + dOrg + ') - ' + DATA.TRANSLATIONS[state.language].officialPortalVerified + ' | ExamSetu & Toolkit';
      if (navigator.share) {
        navigator.share({ title: dName, text: text, url: window.location.href }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text + ' ' + window.location.href).catch(function () {});
        state.copiedShare = true;
        renderDetailModal();
        setTimeout(function () { state.copiedShare = false; if (state.selectedExam) renderDetailModal(); }, 2000);
      }
      return;
    }
    if (action === 'detail-ask-ai' && state.selectedExam) {
      const ex = state.selectedExam;
      const hi = state.language === 'hi';
      const prompt = hi
        ? ex.n + ' (' + ex.o + ') की नवीनतम आधिकारिक परीक्षा तिथि, एडमिट कार्ड, उत्तर कुंजी या रिजल्ट स्थिति जांचकर बताएं।'
        : 'Check the latest official exam status, application/exam dates, admit card, answer key, or result updates for ' + ex.n + ' (' + ex.o + ').';
      state.selectedExam = null;
      state.isTooltipOpen = false;
      state.isTooltipPinned = false;
      renderDetailModal();
      state.chatRoleMode = 'search_advisor';
      state.isChatOpen = true;
      renderChatModal();
      renderFloatingAiButton();
      sendChatMessage(prompt, 'search_advisor');
      return;
    }
    if (action === 'close-guide') { state.guideExam = null; state.guideProcess = null; renderProcessGuideModal(); return; }
    if (action === 'close-legal') { state.legalPage = null; renderLegalModal(); return; }

    const qual = btn.getAttribute('data-qual');
    if (qual) { state.selectedQualification = qual; renderFiltersAndGrid(); return; }

    const cat = btn.getAttribute('data-cat');
    if (cat) {
      if (state.onlyBookmarked) state.onlyBookmarked = false;
      state.selectedCategory = cat;
      renderFiltersAndGrid();
      return;
    }

    const stFilter = btn.getAttribute('data-status');
    if (stFilter) { state.selectedStatus = stFilter; renderFiltersAndGrid(); return; }

    const bmIdx = btn.getAttribute('data-bookmark');
    if (bmIdx !== null) {
      const ex = state.exams[Number(bmIdx)];
      if (ex) toggleBookmark(ex.n);
      return;
    }

    const openIdx = btn.getAttribute('data-open-exam');
    if (openIdx !== null) {
      const ex = state.exams[Number(openIdx)];
      if (ex) {
        state.selectedExam = ex;
        state.isTooltipOpen = false;
        state.isTooltipPinned = false;
        state.copiedShare = false;
        renderDetailModal();
      }
      return;
    }

    const guideIdx = btn.getAttribute('data-open-guide');
    if (guideIdx !== null) {
      const ex = state.exams[Number(guideIdx)];
      const proc = btn.getAttribute('data-process') || 'Apply Online';
      if (ex) {
        state.guideExam = ex;
        state.guideProcess = proc;
        renderProcessGuideModal();
      }
      return;
    }

    const detailGuide = btn.getAttribute('data-detail-guide');
    if (detailGuide && state.selectedExam) {
      state.guideExam = state.selectedExam;
      state.guideProcess = detailGuide;
      renderProcessGuideModal();
      return;
    }

    const checkIdx = btn.getAttribute('data-check-idx');
    if (checkIdx !== null && state.guideExam && state.guideProcess) {
      const hi = state.language === 'hi';
      const bInfo = DATA.BOARD_LOGIN_DATA[state.guideExam.o] || DATA.BOARD_LOGIN_DATA['SSC'];
      const reqSrc = hi && bInfo.req_hi && bInfo.req_hi[state.guideProcess]
        ? bInfo.req_hi[state.guideProcess]
        : (bInfo.req && bInfo.req[state.guideProcess]) || [];
      const itemText = reqSrc[Number(checkIdx)];
      if (itemText) {
        state.checkedItems[itemText] = !state.checkedItems[itemText];
        renderProcessGuideModal();
      }
      return;
    }

    const footerQual = btn.getAttribute('data-footer-qual');
    if (footerQual) {
      state.selectedQualification = footerQual;
      renderFiltersAndGrid();
      scrollToSection('exams-list');
      return;
    }

    const legal = btn.getAttribute('data-legal');
    if (legal) { state.legalPage = legal; renderLegalModal(); return; }

    const chatRole = btn.getAttribute('data-chat-role');
    if (chatRole) {
      state.chatRoleMode = chatRole;
      renderChatModal();
      return;
    }

    const starterIdx = btn.getAttribute('data-starter-idx');
    if (starterIdx !== null) {
      const pt = STARTER_PROMPTS[state.language][Number(starterIdx)];
      if (pt) sendChatMessage(pt);
      return;
    }

    const copyId = btn.getAttribute('data-copy-msg');
    if (copyId) {
      const found = state.chatMessages.find(function (m) { return m.id === copyId; });
      if (found && navigator.clipboard) {
        navigator.clipboard.writeText(found.text).catch(function () {});
        state.copiedChatId = copyId;
        renderChatThreadOnly();
        setTimeout(function () { state.copiedChatId = null; renderChatThreadOnly(); }, 1800);
      }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (state.isTooltipOpen) {
      state.isTooltipOpen = false;
      state.isTooltipPinned = false;
      renderTooltipBox();
      return;
    }
    if (state.guideExam) { state.guideExam = null; state.guideProcess = null; renderProcessGuideModal(); return; }
    if (state.selectedExam) { state.selectedExam = null; renderDetailModal(); return; }
    if (state.isSheetSyncOpen) { state.isSheetSyncOpen = false; renderSheetSyncModal(); return; }
    if (state.legalPage) { state.legalPage = null; renderLegalModal(); return; }
    if (state.isChatOpen) { state.isChatOpen = false; renderChatModal(); renderFloatingAiButton(); }
  });

})();
    </script>
  </body>
</html>
